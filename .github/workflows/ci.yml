name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    # Test database (tests/test_db.py) memakai PostgreSQL sungguhan, versi & digest sama dengan compose.
    # Password ini hanya untuk container CI sekali pakai, bukan secret.
    services:
      postgres:
        image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CLAU_TEST_DB_ADMIN_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres
      # Test database wajib jalan di CI: tanpa database = gagal, bukan dilewati.
      CLAU_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: pytest
        shell: bash
        # Test yang gagal juga ditulis sebagai anotasi (terbaca dari API check-runs tanpa membuka log).
        run: |
          set -o pipefail
          pytest -rfE 2>&1 | tee pytest.log || { grep -E '^(FAILED|ERROR) ' pytest.log | head -30 | sed 's/^/::error::/'; exit 1; }

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Sama dengan deploy VPS 1: tanpa script install paket npm.
      - run: npm ci --ignore-scripts
      - name: build
        shell: bash
        # Error build juga ditulis sebagai anotasi (terbaca dari API check-runs tanpa membuka log).
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || { grep -iE "error|failed|\.tsx?:[0-9]+" build.log | head -30 | sed 's/^/::error::/'; exit 1; }

  # Kerentanan dependency yang sudah diketahui (docs/security.md §5). Gagal bila ada temuan high/critical.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: pip-audit (backend)
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r backend/requirements.txt --strict
      - name: Secret scan (pola umum)
        run: |
          if git grep -nIE '(AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{60,}|sk-ant-[A-Za-z0-9-]{20,}|sk-[A-Za-z0-9]{32,}|xox[baprs]-[A-Za-z0-9-]{10,})' -- . ':!*.lock' ':!package-lock.json'; then
            echo "::error::Kemungkinan credential ter-commit. Hapus, rotasi key, lalu bersihkan riwayat."
            exit 1
          fi

  # Image produksi (backend/Dockerfile, frontend/Dockerfile) harus bisa dibangun, sehat di docker compose,
  # dan tetap memegang pengamanan dasar: /docs mati, Host asing ditolak, proses bukan root.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Worker AI dengan provider tiruan (tanpa biaya, tanpa data keluar). Di level job, bukan per step: restore di
    # step smoke membuat ulang container backend/worker dan harus memakai nilai yang sama (di VPS nilai ini di .env).
    env:
      CLAU_AI_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build & start
        run: |
          scripts/init-env.sh
          docker compose up -d --build --wait --wait-timeout 240
      - name: Smoke test
        run: |
          test "$(docker compose ps -a migrate --format '{{.ExitCode}}')" = 0
          docker compose logs migrate --no-color | grep -q "Running upgrade"
          docker compose run --rm -T backend python -m app.db.seed
          test -z "$(docker compose exec -T backend env | grep -E '^(POSTGRES_PASSWORD|CLAU_DB_MIGRATOR_PASSWORD|CLAU_DB_ADMIN_URL)=')"
          # Login ujung ke ujung lewat frontend (/api → backend): owner dari CLI, lalu wajib aktifkan 2FA.
          docker compose run --rm -T -e CLAU_BOOTSTRAP_PASSWORD=ci-sawah-teras-2026 backend \
            python -m app.auth.cli create-owner --email owner@contoh.test --name "Owner CI"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/content)" = 307
          curl -fsS -c jar -H 'origin: http://127.0.0.1:3000' -H 'content-type: application/json' \
            -d '{"email":"owner@contoh.test","password":"ci-sawah-teras-2026"}' http://127.0.0.1:3000/api/auth/login | grep -q '"next":"mfa_setup"'
          grep -q '__Host-clau_session' jar
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar http://127.0.0.1:3000/api/users)" = 403
          # Endpoint workflow diteruskan jembatan /api (bukan 404) dan tetap terkunci sampai 2FA aktif.
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar http://127.0.0.1:3000/api/requests)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -b jar http://127.0.0.1:3000/api/fact-sheets)" = 403
          # Backup terenkripsi + uji restore ke database sementara (keputusan VPS #6).
          scripts/db-backup.sh
          backup="$(ls -1 backups/*.dump.enc | tail -1)"
          scripts/db-restore.sh --verify "$backup" | tee restore.log
          grep -q "migrasi 0012" restore.log
          # Backup yang diubah 1 byte harus ditolak (HMAC).
          # (`! cmd` tidak menggagalkan step di bash -e; pakai `if`.)
          printf 'x' >> "$backup"
          if scripts/db-restore.sh --verify "$backup"; then echo "::error::backup rusak diterima"; exit 1; fi
          # Pemulihan penuh (clau-vps2-restore, docs/deploy/vps-2-setup.md § 5): backup skema lama (0004) dipulihkan
          # dan dinaikkan ke skema sekarang; isi sebelumnya disimpan dulu; jejak di audit_log.
          psql_ci() { docker compose exec -T -e PGPASSWORD="$(grep -m1 '^POSTGRES_PASSWORD=' .env | cut -d= -f2)" db psql -h 127.0.0.1 -U postgres -d clau -qtA "$@"; }
          docker compose run --rm -T --no-deps migrate alembic downgrade 0004
          scripts/db-backup.sh ci-skema-lama
          docker compose run --rm -T --no-deps migrate alembic upgrade head
          export CLAU_REPO="$PWD" CLAU_OFFSITE_ENV=/nonexistent
          n="$(scripts/deploy/vps2-restore.sh --list | grep ci-skema-lama | sed 's/^ *\([0-9]*\)\..*/\1/')"
          if printf '%s\npulihkan\n' "$n" | scripts/deploy/vps2-restore.sh; then echo "::error::konfirmasi salah diterima"; exit 1; fi
          printf '%s\nPULIHKAN\n' "$n" | scripts/deploy/vps2-restore.sh | tee restore-full.log
          grep -q "restore selesai" restore-full.log
          test "$(psql_ci -c 'SELECT version_num FROM alembic_version')" = 0012
          test "$(psql_ci -c "SELECT count(*) FROM audit_log WHERE action = 'database.restore'")" = 1
          ls backups/*-sebelum-restore.dump.enc
          # Backup dari versi aplikasi yang lebih baru: dibatalkan otomatis, database & backend tetap seperti semula.
          psql_ci -c "UPDATE alembic_version SET version_num = '9999'"
          scripts/db-backup.sh ci-versi-baru
          psql_ci -c "UPDATE alembic_version SET version_num = '0012'"
          if scripts/db-restore.sh --yes "$(ls -1 backups/*ci-versi-baru.dump.enc)"; then echo "::error::backup versi baru diterima"; exit 1; fi
          test "$(psql_ci -c 'SELECT version_num FROM alembic_version')" = 0012
          test "$(psql_ci -c "SELECT count(*) FROM audit_log WHERE action = 'database.restore'")" = 1
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          curl -fsS -o /dev/null http://127.0.0.1:3000/agents
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/docs)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:8000/health)" = 400
          for s in backend worker frontend; do test "$(docker compose exec -T "$s" id -u)" != 0; done
          # Antrean AI ujung ke ujung: job → worker (container terpisah) → draft agent + AI fact-check + QA + biaya.
          docker compose exec -T backend python - < backend/tests/compose_ai_smoke.py
          # Worker tidak memegang password admin/migrasi database.
          test -z "$(docker compose exec -T worker env | grep -E '^(POSTGRES_PASSWORD|CLAU_DB_MIGRATOR_PASSWORD|CLAU_DB_ADMIN_URL|CLAU_SECRET_KEY)=')"
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep ':local'
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop
        if: always()
        run: docker compose down -v

  # Gerbang deploy VPS 1 (AI-BOUNDARY 1.3.0, persetujuan owner 2026-10-13). VPS 1 menayangkan branch
  # release/vps1, bukan main. Branch ini hanya dimajukan ke commit main yang semua job CI di atas hijau,
  # jadi commit merah tidak pernah tayang. GITHUB_TOKEN cukup (repo ini saja); push dari GITHUB_TOKEN
  # tidak memicu workflow lain. Jangan push manual ke release/vps1.
  release-vps1:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, audit, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Majukan release/vps1 ke commit ini
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if git fetch --quiet origin release/vps1 2>/dev/null; then
            live="$(git rev-parse FETCH_HEAD)"
            # Run CI untuk commit main yang lebih baru sudah selesai duluan: jangan mundurkan.
            if git merge-base --is-ancestor "$sha" "$live"; then
              echo "release/vps1 ($live) sudah memuat $sha"
              exit 0
            fi
            git merge-base --is-ancestor "$live" "$sha" \
              || { echo "::error::release/vps1 ($live) bukan leluhur $sha; periksa manual"; exit 1; }
          fi
          git push origin "$sha:refs/heads/release/vps1"
          echo "release/vps1 -> $sha (tayang di VPS 1 dalam ±5 menit)"
