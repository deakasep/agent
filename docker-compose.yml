# CLAU AI platform: database (PostgreSQL 16), migrasi, backend (FastAPI), frontend (Next.js).
#
#   scripts/init-env.sh           # sekali: buat .env dengan password database acak (tidak di-commit)
#   docker compose up -d --build --wait
#   docker compose run --rm backend python -m app.db.seed     # opsional: data contoh SIMULASI
#   docker compose down           # data database tetap di volume db-data (hapus: down -v)
#
# Port hanya dibuka di 127.0.0.1: akses publik selalu lewat reverse proxy (Nginx + TLS),
# sama dengan VPS 1 (docs/deploy/vps-1-setup.md). Database tidak punya port host sama sekali.
# Pengamanan container mengikuti sandbox systemd di docs/security.md § 4: filesystem read-only,
# tanpa capability, tanpa root.
name: clau

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  init: true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-backend-image: &backend-image
  build: { context: ., dockerfile: backend/Dockerfile }
  image: clau-backend:local

services:
  db:
    <<: *hardening
    image: postgres:16-bookworm@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
    # Entrypoint Postgres butuh capability ini sekali untuk menyiapkan folder data lalu turun ke user postgres.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    environment:
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?isi .env dulu: scripts/init-env.sh}"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes: [db-data:/var/lib/postgresql/data]
    tmpfs: [/tmp, /var/run/postgresql]
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    pids_limit: 256

  # Sekali jalan: role & database (app/db/bootstrap.py, akun admin), lalu migrasi (role migrasi).
  # Hanya service ini yang memegang password admin Postgres.
  migrate:
    <<: [*hardening, *backend-image]
    restart: "no"
    command: ["sh", "-c", "python -m app.db.bootstrap && alembic upgrade head"]
    environment:
      CLAU_DB_ADMIN_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@db:5432/postgres
      CLAU_DB_MIGRATOR_PASSWORD: "${CLAU_DB_MIGRATOR_PASSWORD:?isi .env dulu: scripts/init-env.sh}"
      CLAU_DB_APP_PASSWORD: "${CLAU_DB_APP_PASSWORD:?isi .env dulu: scripts/init-env.sh}"
      CLAU_MIGRATION_DATABASE_URL: postgresql+psycopg://clau_migrator:${CLAU_DB_MIGRATOR_PASSWORD:?}@db:5432/clau
    tmpfs: [/tmp]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m
    pids_limit: 128

  backend:
    <<: [*hardening, *backend-image]
    # Variabel diberikan satu per satu (bukan env_file .env): backend tidak pernah memegang password
    # admin Postgres atau role migrasi. Database lewat role aplikasi saja (tanpa DDL, audit_log append-only).
    environment:
      CLAU_ENV: ${CLAU_ENV:-production}
      CLAU_ENABLE_DOCS: ${CLAU_ENABLE_DOCS:-}
      # "backend" selalu ditambahkan: Host saat frontend memanggil lewat jaringan internal compose.
      # Healthcheck container memakai 127.0.0.1, jadi ikut ditambahkan walau domain sudah diatur.
      CLAU_ALLOWED_HOSTS: "${CLAU_ALLOWED_HOSTS:-localhost},backend,127.0.0.1"
      # Default mengikuti CLAU_FRONTEND_PORT, agar ganti port tidak membuat login ditolak (origin_not_allowed).
      CLAU_ALLOWED_ORIGINS: "${CLAU_ALLOWED_ORIGINS:-http://127.0.0.1:${CLAU_FRONTEND_PORT:-3000},http://localhost:${CLAU_FRONTEND_PORT:-3000}}"
      CLAU_HASH_CONCURRENCY: ${CLAU_HASH_CONCURRENCY:-}
      CLAU_SECRET_KEY: "${CLAU_SECRET_KEY:?isi .env dulu: scripts/init-env.sh}"
      CLAU_SESSION_IDLE_MINUTES: ${CLAU_SESSION_IDLE_MINUTES:-}
      CLAU_SESSION_MAX_HOURS: ${CLAU_SESSION_MAX_HOURS:-}
      CLAU_DATABASE_URL: postgresql+psycopg://clau_app:${CLAU_DB_APP_PASSWORD:?}@db:5432/clau
      # Endpoint AI memeriksa tombol mati, intent, provider, dan perkiraan biaya yang sama dengan worker.
      CLAU_AI_ENABLED: ${CLAU_AI_ENABLED:-0}
      CLAU_AI_PROVIDER: ${CLAU_AI_PROVIDER:-fake}
      CLAU_AI_INTENTS: ${CLAU_AI_INTENTS:-caption}
      CLAU_AI_JOB_ESTIMATE_MICRO_USD: ${CLAU_AI_JOB_ESTIMATE_MICRO_USD:-}
      # Langganan & kredit (api-contracts 0.11.0): fake = mode uji; midtrans butuh server key (secret, .env 600).
      CLAU_PAYMENT_PROVIDER: ${CLAU_PAYMENT_PROVIDER:-fake}
      CLAU_MIDTRANS_SERVER_KEY: ${CLAU_MIDTRANS_SERVER_KEY:-}
      CLAU_MIDTRANS_PRODUCTION: ${CLAU_MIDTRANS_PRODUCTION:-}
    ports: ["127.0.0.1:${CLAU_BACKEND_PORT:-8000}:8000"]
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }
    mem_limit: 512m
    pids_limit: 128

  # Worker AI (Tahap 2): mengambil job dari antrean ai_jobs, memanggil provider, menyimpan draft agent. Satu-satunya
  # service yang nanti memegang API key provider (AI-BOUNDARY § Data ke Provider AI); tanpa port, tanpa password admin.
  worker:
    <<: [*hardening, *backend-image]
    command: ["python", "-m", "app.ai.worker"]
    environment:
      CLAU_ENV: ${CLAU_ENV:-production}
      CLAU_DATABASE_URL: postgresql+psycopg://clau_app:${CLAU_DB_APP_PASSWORD:?}@db:5432/clau
      CLAU_AI_ENABLED: ${CLAU_AI_ENABLED:-0}
      CLAU_AI_PROVIDER: ${CLAU_AI_PROVIDER:-fake}
      CLAU_AI_INTENTS: ${CLAU_AI_INTENTS:-caption}
      CLAU_AI_JOB_ESTIMATE_MICRO_USD: ${CLAU_AI_JOB_ESTIMATE_MICRO_USD:-}
      CLAU_AI_WORKER_TIMEOUT_S: ${CLAU_AI_WORKER_TIMEOUT_S:-}
      CLAU_AI_POLL_INTERVAL_S: ${CLAU_AI_POLL_INTERVAL_S:-}
    tmpfs: [/tmp]
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Sehat = putaran worker berjalan (file detak di /tmp diperbarui tiap putaran, juga saat AI dimatikan). Batas 900 s
    # > CLAU_AI_WORKER_TIMEOUT_S bawaan: satu panggilan model yang lama tidak membuat container dianggap mati.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/clau-worker-alive') < 900 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Saat deploy/restart, job yang sedang menunggu model diberi waktu selesai (SIGTERM → putaran terakhir selesai).
    # Bila tetap terputus, job dikembalikan ke antrean setelah CLAU_AI_WORKER_TIMEOUT_S (tidak hilang).
    stop_grace_period: 2m
    mem_limit: 256m
    pids_limit: 64

  frontend:
    <<: *hardening
    build: { context: ., dockerfile: frontend/Dockerfile }
    image: clau-frontend:local
    # Browser hanya bicara ke frontend; /api/* diteruskan server Next.js ke backend lewat jaringan internal
    # (keputusan VPS #1). CLAU_AUTH_ENABLED=1: halaman wajib login. Tanpa keduanya (VPS 1) = pratinjau SIMULASI.
    environment:
      CLAU_BACKEND_URL: http://backend:8000
      CLAU_AUTH_ENABLED: ${CLAU_AUTH_ENABLED:-1}
      # Alamat publik yang dibuka browser (https://…), untuk redirect ke /login di balik reverse proxy.
      CLAU_PUBLIC_ORIGIN: ${CLAU_PUBLIC_ORIGIN:-}
    depends_on:
      backend: { condition: service_healthy }
    ports: ["127.0.0.1:${CLAU_FRONTEND_PORT:-3000}:3000"]
    # Cache ISR Next.js: satu-satunya folder yang ditulis aplikasi (uid 1000 = user node).
    tmpfs:
      - /tmp
      - /app/frontend/.next/cache:uid=1000,gid=1000,mode=0750
    mem_limit: 1g
    pids_limit: 256

volumes:
  db-data:
